  customerId: ID!

  contractId: ID!

  currency: String!

  invoiceDate: Date!

  periodStart: Date!

  periodEndExclusive: Date!

  netAmountMinor: MoneyMinorUnits!

  "Stable for unchanged inputs; freezing verifies against this."
