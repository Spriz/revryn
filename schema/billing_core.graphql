  customerId: ID!

  customerVersion: Int!

  contractId: ID

  billingRunId: ID

  currency: String!

  invoiceDate: Date!

  intentVersion: Int!

  supersedesInvoiceIntentId: ID

  documentKind: String!

  contentHash: String!

  netAmountMinor: MoneyMinorUnits!

  frozenAt: DateTime

  lines: [InvoiceLine!]!
}

"Deterministic, side-effect-free invoice preview (BC-US-068)."
