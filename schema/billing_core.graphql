"One canonical evidence file with its exact bytes, base64-encoded."
type AuditExportFile {
  name: String!
  contentType: String!
  sha256: String!
  contentBase64: String!
}

"An audit package for one invoice chain with its checksum manifest."
type AuditExport {
  invoiceChainId: ID!

  intentCount: Int!

  generatedAt: String!

  "Canonical JSON manifest listing per-file SHA-256 checksums."
  manifestJson: String!

  files: [AuditExportFile!]!
}

"An accountant-approved posting policy version for monthly closes."
type CreditClosePolicy {
  id: ID!

  version: Int!

  effectiveFrom: Date!

  journalNumber: Int!

  liabilityAccountNumber: Int!

  postingMode: String!

  defaultOffsetAccountNumber: Int

  postZeroDelta: Boolean!

  vatNeutral: Boolean!

  "SPEC §9.4.1: none, erp_customer_settlement, or external_reference."
  settlementMode: String!

  settlementClearingAccountNumber: Int

  settlementContraAccountNumber: Int
}

"One receivable settlement opened by one credit application (SPEC §9.4.1)."
type CreditSettlement {
  id: ID!
  invoiceIntentId: ID!
  creditAccountId: ID!
  currency: String!
  amountMinor: Int!
  mode: String!
  state: String!
  externalReference: String
  externalVoucherNumber: String
  reconciledAt: DateTime
  createdAt: DateTime!
}

"Movement-type roll-up inside one close period."
type CreditCloseMovement {
  movementType: String!
  amountMinor: MoneyMinorUnits!
  liabilityEffectMinor: MoneyMinorUnits!
  transactionCount: Int!
}

"Metadata of one immutable evidence file (never inline bytes)."
type CreditCloseEvidenceMeta {
  evidenceType: String!
  sha256: String!
  contentType: String!
  byteSize: Int!
}

"One immutable evidence file with its exact bytes, base64-encoded."
type CreditCloseReport {
  evidenceType: String!
  sha256: String!
  contentType: String!
  contentBase64: String!
}

"One monthly customer-credit close (§11.5 lifecycle)."
type CreditClose {
  id: ID!

  currency: String!

  periodStart: Date!

  periodEndExclusive: Date!

  transactionCutoff: DateTime!

  "regular, reversal, or replacement (ADR-031 compensating closes)."
  closeKind: String!

  "For a correction close: the close it corrects."
  reversalOfCloseId: ID

  "Correction closes referencing this close, oldest first."
  corrections: [CreditClose!]!

  "Current §11.5 state (open, ready, approved, posting, reconciled, closed, ...)."
  state: String!

  openingMinor: MoneyMinorUnits

  closingMinor: MoneyMinorUnits

  netChangeMinor: MoneyMinorUnits

  economicLiabilityLineMinor: MoneyMinorUnits

  ledgerTransactionCount: Int

  reportSha256: String

  closedAt: DateTime

  movements: [CreditCloseMovement!]!

  evidence: [CreditCloseEvidenceMeta!]!

  "Voucher number of the posted aggregate document, once posted."
  externalVoucherNumber: String

  "One stored immutable evidence file with its exact bytes."
  report(evidenceType: String!): CreditCloseReport
}

input CreateCreditClosePolicyInput {
  teamId: ID!

  effectiveFrom: Date!

  journalNumber: Int!

  liabilityAccountNumber: Int!

  defaultOffsetAccountNumber: Int!

  postZeroDelta: Boolean

  vatNeutral: Boolean

  "none (default — blocks automatic credit application), erp_customer_settlement, or external_reference."
  settlementMode: String

  settlementClearingAccountNumber: Int

  settlementContraAccountNumber: Int

  clientMutationId: String!
}

type CreateCreditClosePolicySuccess {
  policy: CreditClosePolicy!
  clientMutationId: String!
}

union CreateCreditClosePolicyResult = CreateCreditClosePolicySuccess | ValidationProblem | AuthorizationProblem

input GenerateCreditCloseInput {
