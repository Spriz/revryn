schema {
  mutation: RootMutationType
  query: RootQueryType
}

type RootQueryType {
  "Schema\/contract version marker for compatibility checks."
  apiVersion: String!

  "The authenticated principal and its memberships."
  viewer: Viewer

  "Organizations the caller actively belongs to."
  organizations: [Organization!]!

  "A single organization the caller belongs to."
  organization(organizationId: ID!): Organization

  "A team the caller is a member of."
  team(teamId: ID!): Team

  "Active teams of an organization the caller belongs to."
  teams(organizationId: ID!): [Team!]!

  "A team customer by ID."
  customer(teamId: ID!, id: ID!): Customer

  "Team customers as a bounded cursor connection (SPEC §14.6)."
  customers(teamId: ID!, first: Int, after: String): CustomerConnection

  "A team contract by ID."
  contract(teamId: ID!, id: ID!): Contract

  "A subscription by ID."
  subscription(teamId: ID!, id: ID!): Subscription

  "Team subscriptions as a bounded cursor connection."
  subscriptions(teamId: ID!, first: Int, after: String): SubscriptionConnection

  "A catalog product by ID."
  product(teamId: ID!, id: ID!): Product

  "Team products as a bounded cursor connection."
  products(teamId: ID!, first: Int, after: String): ProductConnection

  "A plan by ID."
  plan(teamId: ID!, id: ID!): Plan

  "A plan version by ID (draft or published)."
  planVersion(teamId: ID!, id: ID!): PlanVersion

  "A discount by ID."
  discount(teamId: ID!, id: ID!): Discount

  "An immutable invoice intent with lines and lifecycle state."
  invoiceIntent(teamId: ID!, id: ID!): InvoiceIntent

  "Deterministic invoice preview for a subscription (BC-US-068)."
  invoicePreview(teamId: ID!, subscriptionId: ID!, asOf: Date!): InvoicePreview

  "Usage aggregation preview for a metric over a period (BC-US-053)."
  usagePreview(
    teamId: ID!, subscriptionId: ID!, metricCode: String!, periodStart: Date!, periodEndExclusive: Date!, cutoff: DateTime, aggregation: String
  ): UsageAggregate

  "A billing run by ID."
  billingRun(teamId: ID!, id: ID!): BillingRun

  "The team's ERP connection."
  erpConnection(teamId: ID!): ErpConnection

  "A durable operation by ID (team-scoped)."
  operation(teamId: ID!, id: ID!): Operation

  "Pending and settled membership invitations of an organization (BC-US-144)."
  organizationInvitations(organizationId: ID!): [OrganizationInvitation!]!

  "Active membership directory of an organization (owners\/admins)."
  organizationMemberships(organizationId: ID!): [OrganizationMembershipRecord!]!

  "Active membership directory of a team (any team member)."
  teamMemberships(teamId: ID!): [TeamMembershipRecord!]!

  "Audit package for an invoice chain: canonical evidence files + checksum manifest (BC-US-114)."
  auditExport(teamId: ID!, invoiceIntentId: ID!): AuditExport

  "Credit accounts linked to a customer, with subledger evidence (BC-US-107)."
  creditAccounts(teamId: ID!, customerId: ID!): [CreditAccount!]!

  "One monthly customer-credit close (BC-US-163…165)."
  creditClose(teamId: ID!, id: ID!): CreditClose

  "The team's monthly customer-credit closes, newest period first (max 100)."
  creditCloses(teamId: ID!, currency: String, state: String): [CreditClose!]!

  "The team's close posting-policy versions, newest first."
  creditClosePolicies(teamId: ID!): [CreditClosePolicy!]!

  "Receivable settlements opened by credit applications (SPEC §9.4.1)."
  creditSettlements(teamId: ID!, invoiceIntentId: ID, state: String): [CreditSettlement!]!
}

type RootMutationType {
  "Ingests one usage event idempotently by external event ID (BC-US-050)."
  ingestUsageEvent(input: IngestUsageEventInput!): IngestUsageEventResult!

  "Ingests usage events in a batch with per-event independence (BC-US-051)."
  ingestUsageBatch(input: IngestUsageBatchInput!): IngestUsageBatchResult!

  "Voids a measurement, optionally submitting a replacement (BC-US-052)."
  voidUsageEvent(input: VoidUsageEventInput!): VoidUsageEventResult!

  "Creates an organization with its first team (INV-033)."
  createOrganization(input: CreateOrganizationInput!): CreateOrganizationResult!

  "Creates an additional team (organization admins)."
  createTeam(input: CreateTeamInput!): CreateTeamResult!

  "Creates or updates a customer as an immutable version snapshot (BC-US-030)."
  upsertCustomer(input: UpsertCustomerInput!): UpsertCustomerResult!

  "Maps a customer to an ERP customer number (BC-US-031)."
  mapCustomerToErp(input: MapCustomerToErpInput!): MapCustomerToErpResult!

  "Maps a product to an ERP product number (BC-US-011)."
  mapProductToErp(input: MapProductToErpInput!): MapProductToErpResult!

  "Creates a product with its version 1 snapshot (BC-US-010)."
  createProduct(input: CreateProductInput!): CreateProductResult!

  "Creates a plan (stable code owner, BC-US-013)."
  createPlan(input: CreatePlanInput!): CreatePlanResult!

  "Creates a draft plan version with its components in one command."
  createPlanVersion(input: CreatePlanVersionInput!): CreatePlanVersionResult!

  "Publishes a draft plan version, making it immutable (BC-US-014)."
  publishPlanVersion(input: PublishPlanVersionInput!): PublishPlanVersionResult!

  "Creates a contract with its immutable version 1 (BC-US-033)."
  createContract(input: CreateContractInput!): CreateContractResult!

  "Starts a subscription (BC-US-034\/035, SPEC §14.9)."
  createSubscription(input: CreateSubscriptionInput!): CreateSubscriptionResult!

  "Changes a subscription's quantity by appending a version (BC-US-036)."
  changeSubscription(input: ChangeSubscriptionInput!): ChangeSubscriptionResult!

  "Cancels a subscription immediately or at period end (BC-US-038)."
  cancelSubscription(input: CancelSubscriptionInput!): CancelSubscriptionResult!

  "Creates an idempotent one-time charge instance (BC-US-041)."
  createChargeInstance(input: CreateChargeInstanceInput!): CreateChargeInstanceResult!

  "Opens (or returns) a billing run by stable run key (SPEC §18.1)."
  createBillingRun(input: CreateBillingRunInput!): CreateBillingRunResult!

  "Freezes a subscription's preview into immutable invoice intent (BC-US-069)."
  freezeInvoiceIntent(input: FreezeInvoiceIntentInput!): FreezeInvoiceIntentResult!

  "Replaces a frozen, unsynchronized intent in its chain (BC-US-100)."
  supersedeInvoiceIntent(input: SupersedeInvoiceIntentInput!): SupersedeInvoiceIntentResult!

  "Runs the ERP adapter preflight and records capabilities (BC-US-004)."
  validateErpConnection(input: ValidateErpConnectionInput!): ValidateErpConnectionResult!

  "Enqueues ERP draft synchronization; follow the returned operation (§14.11)."
  synchronizeInvoice(input: SynchronizeInvoiceInput!): SynchronizeInvoiceResult!

  "Approves a reconciled ERP draft for booking (BC-US-084)."
  approveInvoice(input: ApproveInvoiceInput!): ApproveInvoiceResult!

  "Enqueues booking of an approved draft (BC-US-085)."
  bookInvoice(input: BookInvoiceInput!): BookInvoiceResult!

  "Manually retries a failed durable operation (finance role, §11.3)."
  retryOperation(input: RetryOperationInput!): RetryOperationResult!

  "Invites an email to organization\/team memberships (BC-US-144)."
  inviteOrganizationMember(input: InviteOrganizationMemberInput!): InviteOrganizationMemberResult!

  "Revokes a pending membership invitation (BC-US-144)."
  revokeOrganizationInvitation(input: RevokeOrganizationInvitationInput!): RevokeOrganizationInvitationResult!

  "Replaces a member's organization roles; the last owner is protected (owners\/admins)."
  changeOrganizationRoles(input: ChangeOrganizationRolesInput!): ChangeOrganizationRolesResult!

  "Adds an existing organization member to a team (team admins, INV-024)."
  addTeamMember(input: AddTeamMemberInput!): AddTeamMemberResult!

  "Replaces a team member's role grants (team admins)."
  changeTeamRoles(input: ChangeTeamRolesInput!): ChangeTeamRolesResult!

  "Removes a member from a team; the history row is retained (team admins)."
  removeTeamMember(input: RemoveTeamMemberInput!): RemoveTeamMemberResult!

  "Renames a team; UUID and slug stay stable (team admins, BC-US-140)."
  renameTeam(input: RenameTeamInput!): RenameTeamResult!

  "Archives a team; the last active team is protected (owners\/admins, INV-033)."
  archiveTeam(input: ArchiveTeamInput!): ArchiveTeamResult!

  "Grants customer credit into the subledger — a liability, never a discount (BC-US-107)."
  grantCredit(input: GrantCreditInput!): GrantCreditResult!

  "Sets the versioned remaining-credit disposition policy (BC-US-109)."
  setCreditDispositionPolicy(input: SetCreditDispositionPolicyInput!): SetCreditDispositionPolicyResult!

  "Creates a monthly-close posting-policy version (BC-US-163)."
  createCreditClosePolicy(input: CreateCreditClosePolicyInput!): CreateCreditClosePolicyResult!

  "Freezes one deterministic close for a currency and calendar month (BC-US-163)."
  generateCreditClose(input: GenerateCreditCloseInput!): GenerateCreditCloseResult!

  "Approves the exact frozen report hash for ERP posting (BC-US-164)."
  approveCreditClose(input: ApproveCreditCloseInput!): ApproveCreditCloseResult!

  "Creates the durable, idempotent ERP posting operation (BC-US-164)."
  requestCreditClosePosting(input: RequestCreditClosePostingInput!): RequestCreditClosePostingResult!

  "Accepts a fully reconciled close as the authoritative period close (BC-US-165)."
  closeCreditPeriod(input: CloseCreditPeriodInput!): CloseCreditPeriodResult!

  "Freezes a compensating reversal close for an accepted close (ADR-031, BC-US-165)."
  requestCreditCloseReversal(input: RequestCreditCloseReversalInput!): RequestCreditCloseReversalResult!

  "Freezes a replacement close for a reversed period under a corrected policy (ADR-031)."
  generateCreditCloseReplacement(input: GenerateCreditCloseReplacementInput!): GenerateCreditCloseReplacementResult!

  "Records the external receivables system's settlement reference exactly once (SPEC §9.4.1)."
  recordExternalSettlement(input: RecordExternalSettlementInput!): RecordExternalSettlementResult!
}

"An active organization membership in the admin directory."
type OrganizationMembershipRecord {
  id: ID!
  userId: ID!
  email: String
  roles: [String!]!
  status: String!
  createdAt: DateTime!
}

"A team membership in the admin directory."
type TeamMembershipRecord {
  id: ID!
  userId: ID!
  email: String
  roles: [String!]!
