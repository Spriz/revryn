}

"A pending or settled membership invitation."
type OrganizationInvitation {
  id: ID!
  email: String!
  organizationRoles: [String!]!
  teamId: ID
  teamRoles: [String!]!
  expiresAt: DateTime!
  acceptedAt: DateTime
  revokedAt: DateTime
  pending: Boolean!
}

