enum IntervalUnit {
  MONTH
  DAY
}

enum BillingTiming {
  IN_ADVANCE
  IN_ARREARS
}

"Versioned pricing definition; exactly one model group is set (SPEC §9.6)."
input PricingDefinitionInput {
  fixedRecurring: FixedRecurringPricingInput
  oneTime: OneTimePricingInput
  standardMetered: StandardMeteredPricingInput
  volumeTier: TieredPricingInput
  graduatedTier: TieredPricingInput
  package: PackagePricingInput
  minimumCommit: MinimumCommitPricingInput
}

input FixedRecurringPricingInput {
  "Unit price per interval in major currency units."
  unitPrice: Decimal!
}

input OneTimePricingInput {
  unitPrice: Decimal!
}

input StandardMeteredPricingInput {
  "Per-unit rate in major currency units."
  unitRate: Decimal!
}

"Contiguous tier: half-open [from, to); the final tier omits `to` (SPEC §10.3\/10.4)."
input PricingTierInput {
  from: Decimal!
  to: Decimal
  unitRate: Decimal!
  flatFeeMinor: MoneyMinorUnits
}

input TieredPricingInput {
  tiers: [PricingTierInput!]!
}

input PackagePricingInput {
  packageSize: Decimal!

  "Price per whole package in major currency units."
  packagePrice: Decimal!
}

"Minimum commit wrapping an inner usage model (SPEC §10.6)."
input MinimumCommitPricingInput {
  minimumAmountMinor: MoneyMinorUnits!
  inner: PricingDefinitionInput!
}

