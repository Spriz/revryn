[tools]
erlang = "29.0.5"
elixir = "1.20.3-otp-29"
go = "1.22.12"
node = "24.19.0"
# Secrets management: fnox stores age-encrypted values in fnox.toml
# (docs/runbooks/secrets.md).
fnox = "1.33.1"
age = "1.3.1"

[env]
# Dev database (docker container `revryn-postgres` on port 55432)
PGHOST = "127.0.0.1"
PGPORT = "55432"
PGUSER = "postgres"
PGPASSWORD = "postgres"
