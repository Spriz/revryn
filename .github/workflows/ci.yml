name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  MIX_ENV: test

jobs:
  test:
    name: Format, compile, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0.5"
          elixir-version: "1.20.3"

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Run migrations from empty schema
        run: mix ecto.create --quiet && mix ecto.migrate --quiet

      - name: Run tests
        run: mix test

      - name: Credo static analysis
        run: mix credo --strict || true

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0.5"
          elixir-version: "1.20.3"

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-dev-${{ runner.os }}-${{ hashFiles('mix.lock') }}

      - name: Prepare app
        env:
          MIX_ENV: dev
        run: |
          mix deps.get
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E suite
        working-directory: e2e
        run: npx playwright test

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            e2e/test-results
            e2e/playwright-report

  billingctl:
    name: billingctl (Go)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check for Go module
        id: gomod
        run: echo "exists=$([ -f go.mod ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        if: steps.gomod.outputs.exists == 'true'
        with:
          go-version: "1.22"

      - name: Vet and test
        if: steps.gomod.outputs.exists == 'true'
        run: |
          go vet ./...
          go build ./...
          go test ./...
